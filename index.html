<script>
  window.fbAsyncInit = function() {
    FB.init({
      appId: '1462033702353611',
      cookie: true,
      xfbml: true,
      version: 'v25.0'
    });

    document.getElementById("status").innerText =
      "Facebook SDK loaded.";
  };

  (function(d, s, id) {
    var js;
    var fjs = d.getElementsByTagName(s)[0];

    if (d.getElementById(id)) return;

    js = d.createElement(s);
    js.id = id;
    js.src = "https://connect.facebook.net/en_US/sdk.js";

    fjs.parentNode.insertBefore(js, fjs);
  }(document, 'script', 'facebook-jssdk'));


  // Receive Embedded Signup information from Meta
  window.addEventListener("message", function(event) {

    if (
      event.origin !== "https://www.facebook.com" &&
      event.origin !== "https://web.facebook.com"
    ) {
      return;
    }

    try {
      const data =
        typeof event.data === "string"
          ? JSON.parse(event.data)
          : event.data;

      if (data.type !== "WA_EMBEDDED_SIGNUP") return;

      console.log("WA Embedded Signup:", data);

      if (
        data.event === "FINISH" ||
        data.event === "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING"
      ) {

        document.getElementById("status").innerText =
          "WhatsApp signup completed!\n\n" +
          "WABA ID: " + (data.data.waba_id || "not returned") + "\n" +
          "Phone Number ID: " +
          (data.data.phone_number_id || "not returned");

      } else {

        document.getElementById("status").innerText =
          "Embedded Signup event:\n" +
          if (response.authResponse?.code) {

  document.getElementById("status").innerText =
    "Meta authorization completed.\nExchanging code...";

  sendCodeToBackend(response.authResponse.code);

} else {

  document.getElementById("status").innerText =
    "Signup was cancelled or failed.";
}
      }

    } catch (error) {
      console.log("Non-JSON Meta message:", event.data);
    }

  });


  function launchWhatsAppSignup() {

    document.getElementById("status").innerText =
      "Opening Meta Embedded Signup...";

    FB.login(
      function(response) {

        console.log("Facebook Login response:", response);

        if (response.authResponse?.code) {

          // DON'T display the code publicly.
          console.log(
            "Authorization code received."
          );

        } else {

          document.getElementById("status").innerText =
            "Signup was cancelled or failed.";
        }

      },
      {
        config_id: '2914689352210009',

        response_type: 'code',
        override_default_response_type: true,

        extras: {
          setup: {},
          sessionInfoVersion: '3'
        }
      }
    );
  }

  async function sendCodeToBackend(code) {

  const backendUrl =
    "YOUR_APPS_SCRIPT_WEB_APP_URL";

  try {

    const response = await fetch(backendUrl, {
      method: "POST",

      headers: {
        "Content-Type": "text/plain"
      },

      body: JSON.stringify({
        code: code
      })
    });

    const data = await response.json();

    console.log("Backend response:", data);

    if (!data.ok) {
      throw new Error(data.error);
    }

    document.getElementById("status").innerText =
      "SUCCESS!\n\n" +
      "Meta business token received by backend.";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "Backend error:\n" +
      error.message;
  }
}
</script>
