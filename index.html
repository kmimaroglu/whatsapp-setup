<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bernadet WhatsApp Setup</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    button {
      font-size: 18px;
      padding: 14px 24px;
      cursor: pointer;
    }

    #status {
      margin-top: 25px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>Bernadet WhatsApp Setup</h1>

  <p>
    Connect the Bernadet WhatsApp Business account to EventMessenger.
  </p>

  <button onclick="launchWhatsAppSignup()">
    Connect WhatsApp Business
  </button>

  <div id="status"></div>


  <script>

    /************************************************************
     * SETTINGS
     ************************************************************/

    const META_APP_ID = "1462033702353611";

    const CONFIG_ID = "2914689352210009";

    const APPS_SCRIPT_URL =
      "YOUR_APPS_SCRIPT_WEB_APP_URL";


    /************************************************************
     * LOAD FACEBOOK SDK
     ************************************************************/

    window.fbAsyncInit = function () {

      FB.init({
        appId: META_APP_ID,
        cookie: true,
        xfbml: true,
        version: "v25.0"
      });

      console.log("Facebook SDK initialized.");
    };


    (function (d, s, id) {

      let js;
      const fjs = d.getElementsByTagName(s)[0];

      if (d.getElementById(id)) {
        return;
      }

      js = d.createElement(s);
      js.id = id;

      js.src =
        "https://connect.facebook.net/en_US/sdk.js";

      fjs.parentNode.insertBefore(js, fjs);

    }(document, "script", "facebook-jssdk"));


    /************************************************************
     * START WHATSAPP EMBEDDED SIGNUP
     ************************************************************/

    function launchWhatsAppSignup() {

      document.getElementById("status").innerText =
        "Opening Meta signup...";

      FB.login(
        function (response) {

          console.log(
            "Facebook Login Response:",
            response
          );

          if (
            response.authResponse &&
            response.authResponse.code
          ) {

            const code =
              response.authResponse.code;

            document.getElementById("status").innerText =
              "WhatsApp authorization successful.\n\n" +
              "Sending authorization code to Apps Script...";

            sendCodeToAppsScript(code);

          } else {

            document.getElementById("status").innerText =
              "WhatsApp authorization was cancelled or failed.";

            console.log(
              "Login failed:",
              response
            );
          }
        },

        {
          config_id: CONFIG_ID,

          response_type: "code",

          override_default_response_type: true,

          extras: {
            setup: {},
            featureType: "",
            sessionInfoVersion: "3"
          }
        }
      );
    }


    /************************************************************
     * SEND AUTHORIZATION CODE TO APPS SCRIPT
     ************************************************************/

    function sendCodeToAppsScript(code) {

      fetch(APPS_SCRIPT_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          action: "metaAuthorization",
          code: code
        })

      })

      .then(function (response) {
        return response.text();
      })

      .then(function (result) {

        console.log(
          "Apps Script response:",
          result
        );

        document.getElementById("status").innerText =
          "Connected successfully!\n\n" +
          result;
      })

      .catch(function (error) {

        console.error(
          "Apps Script error:",
          error
        );

        document.getElementById("status").innerText =
          "Authorization succeeded, but sending the code " +
          "to Apps Script failed.\n\n" +
          error;
      });
    }

  </script>

</body>
</html>
